[project]
name = "flapjax-full"
version = "1.3.4"
description = "FLAPJAX with tests and tutorial notebooks bundled. Install this OR flapjax, not both."
authors = [{ name = "Ben Preston", email = "b.preston23@imperial.ac.uk" }]
keywords = ["aeroelasticity", "unsteady vortex lattice method", "nonlinear beam", "adjoint methods"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jax>=0.8.1",
    "numpy>=2.0",
    "vtk>=9.4",
    "scipy>=1.13",
    "matplotlib>=3.8.4",
    "pytest>=9.0",
]

[project.urls]
Homepage = "https://ben-l-p.github.io/flapjax/"
Documentation = "https://ben-l-p.github.io/flapjax/"
Repository = "https://github.com/ben-l-p/flapjax"
Issues = "https://github.com/ben-l-p/flapjax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../src/flapjax" = "flapjax"

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "LICENSE",
    "pyproject.toml",
]